<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Class Schedule Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script>
    (() => {
      let savedTheme = null;

      try {
        savedTheme = localStorage.getItem("theme");
      } catch (error) {
        savedTheme = null;
      }

      const prefersLight =
        window.matchMedia?.("(prefers-color-scheme: light)")?.matches;
      const theme = savedTheme || (prefersLight ? "light" : "dark");

      if (theme === "light") {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>

  <style>
    /* ─── PORTFOLIO DESIGN TOKENS ───────────────────────── */
    :root {
      --navy:   #0A0F1E;
      --navy2:  #111828;
      --navy3:  #1C2437;
      --slate:  #8892A4;
      --white:  #F0EEE9;
      --blue:   #3B6EF6;
      --blue2:  #5B8BFF;
      --gold:   #F5C842;
      --border: rgba(255,255,255,0.07);
      --nav-bg: rgba(10,15,30,0.85);
      --hero-grid: rgba(59,110,246,0.06);
      --hero-glow: rgba(59,110,246,0.12);
      --placeholder-hover-bg: rgba(59,110,246,0.05);
      --card-hover-border: rgba(59,110,246,0.4);
      --tag-bg: rgba(59,110,246,0.12);
      --tag-border: rgba(59,110,246,0.25);
      --badge-bg: rgba(245,200,66,0.12);
      --badge-border: rgba(245,200,66,0.25);
      --danger: #FF8C82;
      --danger-bg: rgba(255,92,92,0.08);
      --danger-border: rgba(255,140,130,0.28);
      --shadow: rgba(0,0,0,0.28);
      --focus-ring: rgba(91,139,255,0.28);
      --radius: 12px;
      --font-display: "Space Grotesk", sans-serif;
      --font-body: "Inter", sans-serif;
      --font-mono: "JetBrains Mono", monospace;

      /* Schedule aliases resolve through the shared portfolio palette. */
      --page-background: var(--navy);
      --surface: var(--navy2);
      --surface-muted: var(--navy3);
      --text-primary: var(--white);
      --text-secondary: var(--slate);
      --grid-line: var(--border);
      --grid-line-strong: var(--tag-border);
      --focus: var(--blue2);

      /* Change this value to make the on-screen schedule taller or shorter. */
      --grid-height: clamp(630px, 73vh, 760px);

      --time-column-width: 76px;
      --day-header-height: 44px;
      --block-gap: 6px;
      --block-radius: 9px;

      color-scheme: dark;
    }

    html[data-theme="light"] {
      --navy:   #F7F9FC;
      --navy2:  #EEF3F8;
      --navy3:  #FFFFFF;
      --slate:  #526173;
      --white:  #101828;
      --blue:   #2F63E9;
      --blue2:  #2357D8;
      --gold:   #A76F00;
      --border: rgba(16,24,40,0.12);
      --nav-bg: rgba(247,249,252,0.86);
      --hero-grid: rgba(47,99,233,0.09);
      --hero-glow: rgba(47,99,233,0.16);
      --placeholder-hover-bg: rgba(47,99,233,0.07);
      --card-hover-border: rgba(47,99,233,0.36);
      --tag-bg: rgba(47,99,233,0.09);
      --tag-border: rgba(47,99,233,0.22);
      --badge-bg: rgba(167,111,0,0.1);
      --badge-border: rgba(167,111,0,0.22);
      --danger: #B42318;
      --danger-bg: rgba(180,35,24,0.06);
      --danger-border: rgba(180,35,24,0.22);
      --shadow: rgba(15,23,42,0.12);
      --focus-ring: rgba(47,99,233,0.22);
      color-scheme: light;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100%;
      overflow-x: hidden;
      background-color: var(--page-background);
      background-image:
        radial-gradient(circle at 0 0, var(--hero-glow) 0%, transparent 38%),
        linear-gradient(var(--hero-grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--hero-grid) 1px, transparent 1px);
      background-size: auto, 48px 48px, 48px 48px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    .toolbar-link {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--navy3);
      color: var(--text-primary);
      min-height: 42px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        background-color 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        color 0.2s ease,
        opacity 0.2s ease;
    }

    .toolbar-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gold);
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.04em;
      text-decoration: none;
    }

    button:hover:not(:disabled),
    .toolbar-link:hover {
      transform: translateY(-2px);
      background: var(--placeholder-hover-bg);
      border-color: var(--card-hover-border);
    }

    .toolbar-link:hover {
      color: var(--white);
    }

    button:focus-visible,
    .toolbar-link:focus-visible,
    input:focus-visible,
    select:focus-visible,
    .class-block:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
      border-color: var(--focus);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .primary-button {
      color: #ffffff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .primary-button:hover:not(:disabled) {
      background: var(--blue);
      border-color: var(--blue2);
      box-shadow: 0 8px 24px rgba(59,110,246,0.35);
    }

    .danger-button {
      color: var(--danger);
      border-color: var(--danger-border);
      background: var(--danger-bg);
    }

    .danger-button:hover:not(:disabled) {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: var(--danger);
    }

    .theme-toggle {
      width: 42px;
      min-height: 42px;
      padding: 0;
      border-radius: 999px;
      font-size: 18px;
      line-height: 1;
    }

    .app-shell {
      width: min(1760px, 100%);
      margin: 0 auto;
      padding: 32px 48px 64px;
    }

    .app-toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      max-width: none;
      margin: 0;
      background: var(--nav-bg);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .toolbar-inner {
      width: min(1760px, 100%);
      margin: 0 auto;
      padding: 18px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      align-items: start;
      gap: 24px;
    }

    .schedule-card,
    .editor-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 18px 45px var(--shadow);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .schedule-card:hover,
    .editor-panel:hover {
      border-color: var(--card-hover-border);
    }

    .schedule-card {
      min-width: 0;
      padding: 28px;
    }

    .schedule-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    .schedule-kicker {
      margin-bottom: 8px;
      color: var(--blue2);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .schedule-heading h1 {
      margin-bottom: 14px;
      font-family: var(--font-display);
      font-size: clamp(30px, 3vw, 44px);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.03em;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 22px;
      min-height: 24px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }

    .legend-swatch {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      border: 1px solid;
      border-radius: 4px;
    }

    .total-units {
      flex: 0 0 auto;
      padding: 5px 12px;
      color: var(--gold);
      border: 1px solid var(--badge-border);
      border-radius: 999px;
      background: var(--badge-bg);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .schedule-scroll {
      width: 100%;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      border-radius: var(--radius);
      scrollbar-color: var(--blue) var(--navy3);
      scrollbar-width: thin;
    }

    .schedule-scroll::-webkit-scrollbar {
      height: 10px;
    }

    .schedule-scroll::-webkit-scrollbar-track {
      background: var(--navy3);
    }

    .schedule-scroll::-webkit-scrollbar-thumb {
      border: 3px solid var(--navy3);
      border-radius: 999px;
      background: var(--blue);
    }

    .schedule-stage {
      display: grid;
      grid-template-columns: var(--time-column-width) minmax(0, 1fr);
      grid-template-rows: var(--day-header-height) var(--grid-height);
      min-width: 0;
    }

    .corner-header {
      grid-column: 1;
      grid-row: 1;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .day-header {
      grid-column: 2;
      grid-row: 1;
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      overflow: hidden;
      border: 1px solid var(--border);
      border-bottom: 0;
      border-radius: var(--radius) var(--radius) 0 0;
      background: var(--navy3);
    }

    .day-heading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      border-left: 1px solid var(--border);
      color: var(--blue2);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .day-heading:first-child {
      border-left: 0;
    }

    .time-axis {
      position: relative;
      grid-column: 1;
      grid-row: 2;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .time-label {
      position: absolute;
      right: 12px;
      transform: translateY(-50%);
      white-space: nowrap;
    }

    .time-label.first {
      transform: translateY(0);
    }

    .time-label.last {
      transform: translateY(-100%);
    }

    .grid-body {
      position: relative;
      grid-column: 2;
      grid-row: 2;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid var(--border);
      border-radius: 0 0 var(--radius) var(--radius);
      background: var(--navy3);
      touch-action: none;
    }

    .horizontal-grid-line,
    .vertical-grid-line {
      position: absolute;
      z-index: 0;
      pointer-events: none;
    }

    .horizontal-grid-line {
      right: 0;
      left: 0;
      height: 1px;
      background: var(--grid-line);
    }

    .horizontal-grid-line.strong {
      background: var(--grid-line-strong);
    }

    .vertical-grid-line {
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--grid-line);
    }

    .class-block {
      position: absolute;
      z-index: 2;
      display: flex;
      flex-direction: column;
      min-height: 18px;
      overflow: hidden;
      padding: 7px 9px 8px;
      border: 1px solid;
      border-radius: var(--block-radius);
      box-shadow: 0 5px 14px rgba(0,0,0,0.18);
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        filter 0.15s ease,
        outline-color 0.15s ease;
    }

    .class-block:hover {
      transform: translateY(-2px);
      filter: saturate(1.04);
      box-shadow: 0 9px 22px rgba(0,0,0,0.24);
    }

    .class-block.selected {
      z-index: 4;
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
      box-shadow: 0 0 0 1px var(--blue2), 0 10px 26px rgba(0,0,0,0.28);
    }

    .class-block.dragging {
      z-index: 6;
      cursor: grabbing;
      transform: none;
      transition: none;
      box-shadow: 0 14px 30px rgba(0,0,0,0.32);
    }

    .block-course {
      overflow: hidden;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.12;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .block-section {
      overflow: hidden;
      margin-top: 2px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 500;
      line-height: 1.1;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .block-footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 5px;
      min-width: 0;
      margin-top: auto;
      padding-top: 2px;
    }

    .block-room {
      min-width: 0;
      overflow: hidden;
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 500;
      line-height: 1.05;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .block-time {
      flex: 0 0 auto;
      font-family: var(--font-mono);
      font-size: 8.5px;
      font-weight: 500;
      line-height: 1.05;
      white-space: nowrap;
      opacity: 0.92;
    }

    .class-block.compact {
      padding: 5px 8px 6px;
    }

    .class-block.compact .block-course {
      font-size: 11px;
    }

    .class-block.compact .block-section,
    .class-block.compact .block-room {
      font-size: 8.5px;
    }

    .class-block.compact .block-time {
      font-size: 7.8px;
    }

    .resize-handle {
      position: absolute;
      right: 5px;
      bottom: 1px;
      left: 5px;
      height: 7px;
      border-radius: 4px;
      cursor: ns-resize;
      opacity: 0;
      transition: opacity 100ms ease;
    }

    .resize-handle::after {
      position: absolute;
      right: 38%;
      bottom: 1px;
      left: 38%;
      height: 2px;
      content: "";
      border-radius: 999px;
      background: currentColor;
      opacity: 0.55;
    }

    .class-block:hover .resize-handle,
    .class-block.selected .resize-handle {
      opacity: 1;
    }

    .units-footer {
      margin-top: 14px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 400;
    }

    .editor-panel {
      position: sticky;
      top: 102px;
      overflow: hidden;
    }

    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--navy3);
    }

    .editor-header h2 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      min-height: 32px;
      padding: 0;
      color: var(--text-secondary);
      font-size: 18px;
    }

    .editor-empty {
      padding: 20px;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.65;
    }

    .editor-form {
      display: none;
      padding: 20px;
    }

    .editor-panel.has-selection .editor-empty {
      display: none;
    }

    .editor-panel.has-selection .editor-form {
      display: block;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .field label {
      color: var(--blue2);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .field input,
    .field select {
      width: 100%;
      min-width: 0;
      height: 42px;
      padding: 9px 11px;
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--navy3);
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .field input[type="color"] {
      padding: 3px;
      cursor: pointer;
    }

    .selected-summary {
      margin-bottom: 16px;
      padding: 10px 12px;
      color: var(--text-secondary);
      border: 1px solid var(--tag-border);
      border-radius: 6px;
      background: var(--tag-bg);
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.45;
    }

    .editor-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .editor-actions .danger-button {
      grid-column: 1 / -1;
    }

    .screen-reader-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      margin: -1px;
      padding: 0;
      clip: rect(0, 0, 0, 0);
      border: 0;
      white-space: nowrap;
    }

    @media (max-width: 1280px) {
      .workspace {
        grid-template-columns: minmax(0, 1fr);
      }

      .editor-panel {
        position: static;
      }

      .editor-form .form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .selected-summary,
      .editor-actions {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 1100px) {
      .schedule-stage {
        grid-template-columns: var(--time-column-width) minmax(910px, 1fr);
        min-width: 986px;
      }
    }

    @media (max-width: 680px) {
      .app-shell {
        padding: 24px 24px 48px;
      }

      .app-toolbar {
        position: static;
      }

      .toolbar-inner {
        gap: 10px;
        margin: 0 auto;
        padding: 16px 24px;
      }

      .toolbar-inner,
      .schedule-heading {
        align-items: stretch;
        flex-direction: column;
      }

      .toolbar-group {
        flex-wrap: wrap;
        overflow-x: visible;
      }

      .toolbar-group > * {
        flex: 0 0 auto;
      }

      .schedule-card {
        padding: 20px;
      }

      .total-units {
        align-self: flex-start;
      }

      .editor-form .form-grid {
        grid-template-columns: 1fr;
      }

      .schedule-stage {
        grid-template-columns: 68px minmax(910px, 1fr);
        min-width: 978px;
      }
    }

    @page {
      size: landscape;
      margin: 7mm;
    }

    @media print {
      :root {
        --grid-height: 600px;
        --time-column-width: 61px;
        --day-header-height: 35px;
        --block-gap: 4px;
        --block-radius: 6px;
      }

      html,
      body {
        width: 100%;
        min-height: auto;
        background: #ffffff;
        color: #172033;
      }

      body {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .app-shell {
        width: 100%;
        margin: 0;
        padding: 0;
      }

      .app-toolbar,
      .editor-panel,
      .resize-handle {
        display: none !important;
      }

      .workspace {
        display: block;
      }

      .schedule-card {
        background: #ffffff;
        color: #172033;
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .schedule-heading {
        align-items: flex-start;
        margin-bottom: 8px;
      }

      .schedule-heading h1 {
        margin-bottom: 6px;
        font-size: 21px;
      }

      .day-header,
      .grid-body {
        background: #ffffff;
        border-color: #d8e0ea;
      }

      .day-heading {
        color: #2357D8;
        border-color: #d8e0ea;
      }

      .horizontal-grid-line,
      .vertical-grid-line {
        background: #e3e8ef;
      }

      .horizontal-grid-line.strong {
        background: #cbd5e1;
      }

      .legend {
        gap: 7px 18px;
      }

      .legend-item {
        font-size: 10px;
      }

      .legend-swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
      }

      .total-units {

  <script>
    "use strict";

    const themeToggle = document.querySelector(".theme-toggle");

    const setThemeToggleState = () => {
      const isLight = document.documentElement.dataset.theme === "light";
      themeToggle.textContent = isLight ? "☀" : "☾";
      themeToggle.setAttribute(
        "aria-label",
        isLight ? "Switch to dark mode" : "Switch to light mode"
      );
      themeToggle.setAttribute("aria-pressed", String(isLight));
    };

    themeToggle.addEventListener("click", () => {
      const isLight = document.documentElement.dataset.theme === "light";
      const nextTheme = isLight ? "dark" : "light";

      if (nextTheme === "light") {
        document.documentElement.dataset.theme = "light";
      } else {
        delete document.documentElement.dataset.theme;
      }

      try {
        localStorage.setItem("theme", nextTheme);
      } catch (error) {
        // The toggle should still work when storage is unavailable.
      }

      setThemeToggleState();
    });

    setThemeToggleState();

    /*
     * ================================================================

     * snapping interval, or minimum allowed class duration.

      "Wednesday",
      "Thursday",
      "Friday",
      "Saturday",

    const RANGE_START = 8 * 60 + 30; // 8:30 AM
    const RANGE_END = 19 * 60;       // 7:00 PM

    const SNAP_MINUTES = 10;
    const MIN_DURATION = 20;
    const DEFAULT_UNITS = 4;

    };

    let classes = loadSavedClasses();
    let selectedId = null;
    let undoStack = [];
    let redoStack = [];
    let interaction = null;

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function makeId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }

      return `class-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function clamp(value, minimum, maximum) {
      return Math.min(Math.max(value, minimum), maximum);
    }

    function snapMinutes(value) {
      return Math.round(value / SNAP_MINUTES) * SNAP_MINUTES;
    }

    function normalizeCourseName(value) {
      return String(value || "NEW COURSE").trim().replace(/\s+/g, " ") ||
        "NEW COURSE";
    }

    function courseNameKey(value) {
      return normalizeCourseName(value).toUpperCase();
    }

    function courseIdForName(value) {
      const key = courseNameKey(value);
      const slug = key
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "") || "course";

      let hash = 0;

      for (let index = 0; index < key.length; index += 1) {
        hash = (hash * 31 + key.charCodeAt(index)) >>> 0;
      }

      return `course-${slug}-${hash.toString(36)}`;
    }

    function makeUniqueCourseId(courseName) {
      const base = courseIdForName(courseName);
      let candidate = base;
      let suffix = 2;

      while (classes.some((item) => item.courseId === candidate)) {
        candidate = `${base}-${suffix}`;
        suffix += 1;
      }

      return candidate;
    }

    function isValidUnits(value) {
      if (value === "" || value === null || value === undefined) {
        return false;
      }

      const numeric = Number(value);
      return Number.isFinite(numeric) && numeric > 0;
    }

    function normalizeUnits(value, fallback = DEFAULT_UNITS) {
      const numeric = isValidUnits(value) ? Number(value) : Number(fallback);
      return Math.round(numeric * 10) / 10;
    }

    function defaultUnitsForCourse(courseName) {
      const configured = DEFAULT_COURSE_UNITS[courseNameKey(courseName)];
      return normalizeUnits(configured, DEFAULT_UNITS);
    }

    function formatUnits(value) {
      return normalizeUnits(value, 0).toFixed(1);
    }

    function snapshot() {
      return JSON.stringify(classes);
    }

    function persistSchedule(value) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(value));
    }

    function saveSchedule() {
      try {
        persistSchedule(classes);
      } catch (error) {
        console.warn("The schedule could not be saved to localStorage.", error);
      }
    }

    function sanitizeClass(item, courseData) {
      const start = clamp(
        snapMinutes(Number(item.start) || RANGE_START),
        RANGE_START,
        RANGE_END - MIN_DURATION
      );

      const end = clamp(
        snapMinutes(Number(item.end) || start + 50),
        start + MIN_DURATION,
        RANGE_END
      );

      return {
        id: typeof item.id === "string" && item.id ? item.id : makeId(),
        courseId: courseData.id,
        course: courseData.name,
        units: courseData.units,
        section: String(item.section || "LECTURE"),
        room: String(item.room || "TBD"),
        day: clamp(Math.round(Number(item.day) || 0), 0, DAYS.length - 1),
        start,
        end,
        color: /^#[0-9a-f]{6}$/i.test(String(item.color))
          ? String(item.color)
          : COLORS.compsci
      };
    }

    function sanitizeClasses(items) {
      const prepared = items.map((item) => {
        const courseName = normalizeCourseName(item.course);
        const providedCourseId =
          typeof item.courseId === "string" && item.courseId.trim()
            ? item.courseId.trim()
            : null;

        return {
          item,
          courseName,
          groupKey: providedCourseId
            ? `id:${providedCourseId}`
            : `name:${courseNameKey(courseName)}`,
          courseId: providedCourseId || courseIdForName(courseName)
        };
      });

      const courseRegistry = new Map();

      prepared.forEach((entry) => {
        if (!courseRegistry.has(entry.groupKey)) {
          courseRegistry.set(entry.groupKey, {
            id: entry.courseId,
            name: entry.courseName,
            units: defaultUnitsForCourse(entry.courseName),
            hasExplicitUnits: false
          });
        }

        const courseData = courseRegistry.get(entry.groupKey);

        if (!courseData.hasExplicitUnits && isValidUnits(entry.item.units)) {
          courseData.units = normalizeUnits(entry.item.units);
          courseData.hasExplicitUnits = true;
        }
      });

      return prepared.map((entry) => {
        const courseData = courseRegistry.get(entry.groupKey);
        return sanitizeClass(entry.item, courseData);
      });
    }

    function loadSavedClasses() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));

        if (Array.isArray(saved)) {
          const migrated = sanitizeClasses(saved);

          if (JSON.stringify(saved) !== JSON.stringify(migrated)) {
            persistSchedule(migrated);
          }

          return migrated;
        }
      } catch (error) {
        console.warn("The saved schedule could not be read.", error);
      }

      const initial = sanitizeClasses(INITIAL_CLASSES);

      try {
        persistSchedule(initial);
      } catch (error) {
        console.warn("The initial schedule could not be saved.", error);
      }

      return initial;
    }

    function recordPreviousSnapshot(previousSnapshot) {
      if (previousSnapshot === snapshot()) {
        return;
      }

      undoStack.push(previousSnapshot);
      redoStack = [];
      saveSchedule();
      updateControlStates();
    }

    function restoreSnapshot(serialized) {
      const parsed = JSON.parse(serialized);
      classes = sanitizeClasses(parsed);

      if (selectedId && !classes.some((item) => item.id === selectedId)) {
        selectedId = null;
      }

      saveSchedule();
      renderAll();
    }

    function undo() {
      if (!undoStack.length) {
        return;
      }

      const current = snapshot();
      const previous = undoStack.pop();

      redoStack.push(current);
      restoreSnapshot(previous);
    }

    function redo() {
      if (!redoStack.length) {
        return;
      }

      const current = snapshot();
      const next = redoStack.pop();

      undoStack.push(current);
      restoreSnapshot(next);
    }

    function minutesToInput(minutes) {
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;

      return `${String(hours).padStart(2, "0")}:${String(mins).padStart(2, "0")}`;
    }

    function inputToMinutes(value) {
      const [hours, minutes] = value.split(":").map(Number);
      return hours * 60 + minutes;
    }

    function formatTime(minutes, includePeriod = true) {
      const hours24 = Math.floor(minutes / 60);
      const mins = minutes % 60;
      const period = hours24 >= 12 ? "PM" : "AM";
      const hours12 = hours24 % 12 || 12;
      const minuteText = String(mins).padStart(2, "0");

      return `${hours12}:${minuteText}${includePeriod ? ` ${period}` : ""}`;
    }

    function formatTimeRange(start, end) {
      const startPeriod = start >= 12 * 60 ? "PM" : "AM";
      const endPeriod = end >= 12 * 60 ? "PM" : "AM";

      if (startPeriod === endPeriod) {
        return `${formatTime(start, false)}-${formatTime(end, true)}`;
      }

      return `${formatTime(start, true)}-${formatTime(end, true)}`;
    }

    function percentForMinute(minutes) {
      return ((minutes - RANGE_START) / (RANGE_END - RANGE_START)) * 100;
    }

    function hexToRgb(hex) {
      const normalized = hex.replace("#", "");
      const value = parseInt(normalized, 16);

      return {
        r: (value >> 16) & 255,
        g: (value >> 8) & 255,
        b: value & 255
      };
    }

    function rgbToHex({ r, g, b }) {
      const channel = (value) =>
        clamp(Math.round(value), 0, 255).toString(16).padStart(2, "0");

      return `#${channel(r)}${channel(g)}${channel(b)}`;
    }

    function darkenColor(hex, amount = 0.38) {
      const rgb = hexToRgb(hex);

      return rgbToHex({
        r: rgb.r * (1 - amount),
        g: rgb.g * (1 - amount),
        b: rgb.b * (1 - amount)
      });
    }

    function readableTextColor(hex) {
      const { r, g, b } = hexToRgb(hex);

      const normalized = [r, g, b].map((channel) => {
        const value = channel / 255;
        return value <= 0.03928
          ? value / 12.92
          : Math.pow((value + 0.055) / 1.055, 2.4);
      });

      const luminance =
        0.2126 * normalized[0] +
        0.7152 * normalized[1] +
        0.0722 * normalized[2];

      return luminance > 0.52 ? darkenColor(hex, 0.7) : "#ffffff";
    }

    function getSelectedClass() {
      return classes.find((item) => item.id === selectedId) || null;
    }

    function getCourseCatalog() {
      const coursesById = new Map();

      classes.forEach((item) => {
        if (!coursesById.has(item.courseId)) {
          coursesById.set(item.courseId, {
            id: item.courseId,
            name: item.course,
            units: normalizeUnits(item.units),
            color: item.color
          });
        }
      });

      return [...coursesById.values()];
    }

    function announce(message) {
      elements.liveRegion.textContent = "";

      window.setTimeout(() => {
        elements.liveRegion.textContent = message;
      }, 20);
    }

    function renderDayHeader() {
      elements.dayHeader.replaceChildren();

      DAYS.forEach((day) => {
        const heading = document.createElement("div");
        heading.className = "day-heading";
        heading.textContent = day;
        elements.dayHeader.appendChild(heading);
      });
    }

    function renderTimeAxisAndGrid() {
      elements.timeAxis.replaceChildren();
      elements.gridBody.replaceChildren();

      for (
        let minute = RANGE_START;
        minute <= RANGE_END;
        minute += 30
      ) {
        const percentage = percentForMinute(minute);
        const isStrong =
          minute === RANGE_START ||
          minute === RANGE_END ||
          minute % 60 === 0;

        const line = document.createElement("div");
        line.className = `horizontal-grid-line${isStrong ? " strong" : ""}`;
        line.style.top = `${percentage}%`;
        elements.gridBody.appendChild(line);
      }

      const labelMinutes = [RANGE_START];

      for (
        let minute = Math.ceil(RANGE_START / 60) * 60;
        minute <= RANGE_END;
        minute += 60
      ) {
        if (!labelMinutes.includes(minute)) {
          labelMinutes.push(minute);
        }
      }

      labelMinutes.forEach((minute, index) => {
        const label = document.createElement("div");
        label.className = "time-label";

        if (index === 0) {
          label.classList.add("first");
        }

        if (minute === RANGE_END) {
          label.classList.add("last");
        }

        label.style.top = `${percentForMinute(minute)}%`;
        label.textContent = formatTime(minute, true);
        elements.timeAxis.appendChild(label);
      });

      for (let index = 1; index < DAYS.length; index += 1) {
        const line = document.createElement("div");
        line.className = "vertical-grid-line";
        line.style.left = `${(index / DAYS.length) * 100}%`;
        elements.gridBody.appendChild(line);
      }
    }

    function positionBlock(element, item) {
      const dayWidth = 100 / DAYS.length;
      const duration = item.end - item.start;

      element.style.left =
        `calc(${item.day * dayWidth}% + var(--block-gap))`;

      element.style.width =
        `calc(${dayWidth}% - (var(--block-gap) * 2))`;

      element.style.top = `${percentForMinute(item.start)}%`;

      element.style.height =
        `${(duration / (RANGE_END - RANGE_START)) * 100}%`;
    }

    function updateBlockContent(element, item) {
      element.dataset.courseId = item.courseId;
      element.querySelector(".block-course").textContent = item.course;
      element.querySelector(".block-section").textContent = item.section;
      element.querySelector(".block-room").textContent = item.room;
      element.querySelector(".block-time").textContent =
        formatTimeRange(item.start, item.end);

      element.setAttribute(
        "aria-label",
        `${item.course}, ${item.section}, ${DAYS[item.day]}, ` +
        `${formatTimeRange(item.start, item.end)}, ${item.room}`
      );

      element.style.backgroundColor = item.color;
      element.style.borderColor = darkenColor(item.color, 0.42);
      element.style.color = readableTextColor(item.color);

      element.classList.toggle("compact", item.end - item.start <= 60);
      element.classList.toggle("selected", item.id === selectedId);

      positionBlock(element, item);
    }

    function createClassBlock(item) {
      const block = document.createElement("article");
      block.className = "class-block";
      block.dataset.id = item.id;
      block.tabIndex = 0;

      const course = document.createElement("div");
      course.className = "block-course";

      const section = document.createElement("div");
      section.className = "block-section";

      const footer = document.createElement("div");
      footer.className = "block-footer";

      const room = document.createElement("span");
      room.className = "block-room";

      const time = document.createElement("span");
      time.className = "block-time";

      const resizeHandle = document.createElement("div");
      resizeHandle.className = "resize-handle";
      resizeHandle.setAttribute("aria-hidden", "true");

      footer.append(room, time);
      block.append(course, section, footer, resizeHandle);

      updateBlockContent(block, item);

      return block;
    }

    function renderBlocks() {
      const sortedClasses = [...classes].sort((first, second) => {
        return (
          first.day - second.day ||
          first.start - second.start ||
          first.end - second.end
        );
      });

      sortedClasses.forEach((item) => {
        elements.gridBody.appendChild(createClassBlock(item));
      });
    }

    function renderLegend() {
      elements.legend.replaceChildren();

      getCourseCatalog().forEach((course) => {
        const item = document.createElement("div");
        item.className = "legend-item";

        const swatch = document.createElement("span");
        swatch.className = "legend-swatch";
        swatch.style.backgroundColor = course.color;
        swatch.style.borderColor = darkenColor(course.color, 0.42);

        const label = document.createElement("span");
        label.textContent = course.name;

        item.append(swatch, label);
        elements.legend.appendChild(item);
      });
    }

    function renderCourseSummary() {
      const courses = getCourseCatalog();
      const total = courses.reduce((sum, course) => sum + course.units, 0);

      elements.totalUnits.textContent = `${formatUnits(total)} total units`;

      if (!courses.length) {
        elements.unitsFooter.textContent = "No courses scheduled";
        return;
      }

      const summary = courses
        .map((course) => `${course.name} - ${formatUnits(course.units)}`)
        .join("  |  ");

      elements.unitsFooter.textContent = `Units: ${summary}`;
    }

    function renderSchedule() {
      renderTimeAxisAndGrid();
      renderBlocks();
    }

    function renderAll() {
      renderLegend();
      renderCourseSummary();
      renderSchedule();
      syncEditorFromSelection();
      updateControlStates();
    }

    function setSelected(id, shouldRender = true) {
      selectedId = id;

      if (shouldRender) {
        renderAll();
      } else {
        document.querySelectorAll(".class-block").forEach((block) => {
          block.classList.toggle("selected", block.dataset.id === selectedId);
        });

        syncEditorFromSelection();
        updateControlStates();
      }
    }

    function clearSelection() {
      selectedId = null;
      renderAll();
    }

    function syncEditorFromSelection() {
      const selected = getSelectedClass();
      const hasSelection = Boolean(selected);

      elements.editorPanel.classList.toggle("has-selection", hasSelection);

      if (!selected) {
        return;
      }

      elements.courseInput.value = selected.course;
      elements.unitsInput.value = formatUnits(selected.units);
      elements.sectionInput.value = selected.section;
      elements.roomInput.value = selected.room;
      elements.dayInput.value = String(selected.day);
      elements.startInput.value = minutesToInput(selected.start);
      elements.endInput.value = minutesToInput(selected.end);
      elements.colorInput.value = selected.color;

      elements.selectedSummary.textContent =
        `${DAYS[selected.day]} · ` +
        `${formatTimeRange(selected.start, selected.end)} · ` +
        `${selected.room} · ${formatUnits(selected.units)} units`;
    }

    function updateControlStates() {
      const hasSelection = Boolean(getSelectedClass());

      elements.duplicateButton.disabled = !hasSelection;
      elements.deleteButton.disabled = !hasSelection;
      elements.undoButton.disabled = undoStack.length === 0;
      elements.redoButton.disabled = redoStack.length === 0;
    }

    function populateEditorOptions() {
      DAYS.forEach((day, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = day;
        elements.dayInput.appendChild(option);
      });

      for (
        let minute = RANGE_START;
        minute <= RANGE_END;
        minute += SNAP_MINUTES
      ) {
        const startOption = document.createElement("option");
        startOption.value = minutesToInput(minute);
        startOption.textContent = formatTime(minute, true);

        const endOption = startOption.cloneNode(true);

        elements.startInput.appendChild(startOption);
        elements.endInput.appendChild(endOption);
      }
    }

    function applyEditorChanges() {
      const selected = getSelectedClass();

      if (!selected) {
        return;
      }

      elements.unitsInput.setCustomValidity("");

      if (
        !isValidUnits(elements.unitsInput.value) ||
        !elements.unitsInput.checkValidity()
      ) {
        elements.unitsInput.setCustomValidity(
          "Enter a positive unit value."
        );
        elements.unitsInput.reportValidity();
        elements.unitsInput.value = formatUnits(selected.units);
        return;
      }

      const previous = snapshot();
      const previousCourseId = selected.courseId;
      const nextCourseName = normalizeCourseName(elements.courseInput.value);
      const nextUnits = normalizeUnits(elements.unitsInput.value);
      const matchingCourse = classes.find((item) => {
        return (
          item.courseId !== previousCourseId &&
          courseNameKey(item.course) === courseNameKey(nextCourseName)
        );
      });
      const nextCourseId = matchingCourse
        ? matchingCourse.courseId
        : previousCourseId;

      classes.forEach((item) => {
        if (item.courseId === previousCourseId) {
          item.courseId = nextCourseId;
        }

        if (item.courseId === nextCourseId) {
          item.course = nextCourseName;
          item.units = nextUnits;
        }
      });

      selected.section = elements.sectionInput.value.trim() || "LECTURE";
      selected.room = elements.roomInput.value.trim() || "TBD";
      selected.day = clamp(
        Number(elements.dayInput.value),
        0,
        DAYS.length - 1
      );
      selected.color = elements.colorInput.value;

      let start = inputToMinutes(elements.startInput.value);
      let end = inputToMinutes(elements.endInput.value);

      start = clamp(
        snapMinutes(start),
        RANGE_START,
        RANGE_END - MIN_DURATION
      );

      end = clamp(
        snapMinutes(end),
        start + MIN_DURATION,
        RANGE_END
      );

      selected.start = start;
      selected.end = end;

      recordPreviousSnapshot(previous);
      renderAll();

      announce(
        `${selected.course} updated to ${DAYS[selected.day]}, ` +
        `${formatTimeRange(selected.start, selected.end)}, ` +
        `${formatUnits(selected.units)} units.`
      );
    }

    function overlapsExisting(candidate, ignoredId = null) {
      return classes.some((item) => {
        if (item.id === ignoredId || item.day !== candidate.day) {
          return false;
        }

        return candidate.start < item.end && candidate.end > item.start;
      });
    }

    function findAvailableSlot(duration, preferredDay = 0, preferredStart = RANGE_START) {
      for (let dayOffset = 0; dayOffset < DAYS.length; dayOffset += 1) {
        const day = (preferredDay + dayOffset) % DAYS.length;
        const firstStart =
          dayOffset === 0 ? preferredStart : RANGE_START;

        for (
          let start = firstStart;
          start + duration <= RANGE_END;
          start += SNAP_MINUTES
        ) {
          const candidate = {
            day,
            start,
            end: start + duration
          };

          if (!overlapsExisting(candidate)) {
            return candidate;
          }
        }

        for (
          let start = RANGE_START;
          start < firstStart && start + duration <= RANGE_END;
          start += SNAP_MINUTES
        ) {
          const candidate = {
            day,
            start,
            end: start + duration
          };

          if (!overlapsExisting(candidate)) {
            return candidate;
          }
        }
      }

      return {
        day: preferredDay,
        start: RANGE_START,
        end: RANGE_START + duration
      };
    }

    function addClass() {
      const previous = snapshot();
      const duration = 50;
      const slot = findAvailableSlot(duration);

      const item = {
        id: makeId(),
        courseId: makeUniqueCourseId("NEW COURSE"),
        course: "NEW COURSE",
        units: DEFAULT_UNITS,
        section: "LECTURE",
        room: "TBD",
        day: slot.day,
        start: slot.start,
        end: slot.end,
        color: COLORS.compsci
      };

      classes.push(item);
      selectedId = item.id;

      recordPreviousSnapshot(previous);
      renderAll();

      elements.editorPanel.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });

      elements.courseInput.focus();
      elements.courseInput.select();

      announce("New class added.");
    }

    function duplicateSelected() {
      const selected = getSelectedClass();

      if (!selected) {
        return;
      }

      const previous = snapshot();
      const duration = selected.end - selected.start;
      const preferredDay = (selected.day + 1) % DAYS.length;

      let slot = {
        day: preferredDay,
        start: selected.start,
        end: selected.end
      };

      if (overlapsExisting(slot)) {
        slot = findAvailableSlot(duration, preferredDay, selected.start);
      }

      const duplicate = {
        ...clone(selected),
        id: makeId(),
        day: slot.day,
        start: slot.start,
        end: slot.end
      };

      classes.push(duplicate);
      selectedId = duplicate.id;

      recordPreviousSnapshot(previous);
      renderAll();

      announce(
        `${duplicate.course} duplicated to ${DAYS[duplicate.day]}, ` +
        `${formatTimeRange(duplicate.start, duplicate.end)}.`
      );
    }

    function deleteSelected() {
      const selected = getSelectedClass();

      if (!selected) {
        return;
      }

      const previous = snapshot();
      const deletedName = selected.course;

      classes = classes.filter((item) => item.id !== selectedId);
      selectedId = null;

      recordPreviousSnapshot(previous);
      renderAll();

      announce(`${deletedName} deleted.`);
    }

    function resetSchedule() {
      const confirmed = window.confirm(
        "Reset the schedule to its original classes, times, rooms, units, and colors?"
      );

      if (!confirmed) {
        return;
      }

      const previous = snapshot();

      classes = sanitizeClasses(INITIAL_CLASSES);
      selectedId = null;

      recordPreviousSnapshot(previous);
      renderAll();

      announce("The original schedule has been restored.");
    }

    function beginInteraction(event, block, mode) {
      const item = classes.find((entry) => entry.id === block.dataset.id);

      if (!item) {
        return;
      }

      event.preventDefault();

      setSelected(item.id, false);

      const bodyRect = elements.gridBody.getBoundingClientRect();
      const blockRect = block.getBoundingClientRect();

      interaction = {
        mode,
        pointerId: event.pointerId,
        id: item.id,
        element: block,
        previousSnapshot: snapshot(),
        bodyRect,
        grabOffsetX: event.clientX - blockRect.left,
        grabOffsetY: event.clientY - blockRect.top
      };

      block.classList.add("dragging");
      block.setPointerCapture(event.pointerId);
    }

    function updateDrag(event) {
      if (!interaction || interaction.pointerId !== event.pointerId) {
        return;
      }

      const item = classes.find((entry) => entry.id === interaction.id);

      if (!item) {
        return;
      }

      event.preventDefault();

      const bodyRect = elements.gridBody.getBoundingClientRect();
      const pixelsPerMinute =
        bodyRect.height / (RANGE_END - RANGE_START);

      if (interaction.mode === "drag") {
        const dayWidth = bodyRect.width / DAYS.length;

        const proposedLeft =
          event.clientX -
          bodyRect.left -
          interaction.grabOffsetX;

        const proposedCenter = proposedLeft + dayWidth / 2;

        item.day = clamp(
          Math.floor(proposedCenter / dayWidth),
          0,
          DAYS.length - 1
        );

        const proposedTop =
          event.clientY -
          bodyRect.top -
          interaction.grabOffsetY;

        const duration = item.end - item.start;

        const proposedStart =
          RANGE_START + proposedTop / pixelsPerMinute;

        const newStart = clamp(
          snapMinutes(proposedStart),
          RANGE_START,
          RANGE_END - duration
        );

        item.start = newStart;
        item.end = newStart + duration;
      }

      if (interaction.mode === "resize") {
        const proposedBottom = event.clientY - bodyRect.top;

        const proposedEnd =
          RANGE_START + proposedBottom / pixelsPerMinute;

        item.end = clamp(
          snapMinutes(proposedEnd),
          item.start + MIN_DURATION,
          RANGE_END
        );
      }

      updateBlockContent(interaction.element, item);
      syncEditorFromSelection();
    }

    function finishInteraction(event) {
      if (!interaction || interaction.pointerId !== event.pointerId) {
        return;
      }

      const finishedInteraction = interaction;
      interaction = null;

      try {
        finishedInteraction.element.releasePointerCapture(event.pointerId);
      } catch (error) {
        // The pointer may already have been released by the browser.
      }

      finishedInteraction.element.classList.remove("dragging");

      recordPreviousSnapshot(finishedInteraction.previousSnapshot);
      renderAll();

      const item = classes.find(
        (entry) => entry.id === finishedInteraction.id
      );

      if (item) {
        announce(
          `${item.course} moved to ${DAYS[item.day]}, ` +
          `${formatTimeRange(item.start, item.end)}.`
        );
      }
    }

    function moveSelectedWithKeyboard(event, block) {
      const item = classes.find((entry) => entry.id === block.dataset.id);

      if (!item) {
        return;
      }

      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        setSelected(item.id);
        return;
      }

      if (event.key === "Delete" || event.key === "Backspace") {
        event.preventDefault();
        setSelected(item.id, false);
        deleteSelected();
        return;
      }

      const isArrow =
        event.key === "ArrowUp" ||
        event.key === "ArrowDown" ||
        event.key === "ArrowLeft" ||
        event.key === "ArrowRight";

      if (!isArrow) {
        return;
      }

      event.preventDefault();
      setSelected(item.id, false);

      const previous = snapshot();
      const duration = item.end - item.start;

      if (event.key === "ArrowUp") {
        item.start = clamp(
          item.start - SNAP_MINUTES,
          RANGE_START,
          RANGE_END - duration
        );
        item.end = item.start + duration;
      }

      if (event.key === "ArrowDown") {
        item.start = clamp(
          item.start + SNAP_MINUTES,
          RANGE_START,
          RANGE_END - duration
        );
        item.end = item.start + duration;
      }

      if (event.key === "ArrowLeft") {
        item.day = clamp(item.day - 1, 0, DAYS.length - 1);
      }

      if (event.key === "ArrowRight") {
        item.day = clamp(item.day + 1, 0, DAYS.length - 1);
      }

      recordPreviousSnapshot(previous);
      renderAll();

      const updatedBlock = elements.gridBody.querySelector(
        `[data-id="${CSS.escape(item.id)}"]`
      );

      updatedBlock?.focus();
    }

    elements.gridBody.addEventListener("pointerdown", (event) => {
      const block = event.target.closest(".class-block");

      if (!block) {
        return;
      }

      const isResizeHandle = Boolean(
        event.target.closest(".resize-handle")
      );

      beginInteraction(
        event,
        block,
        isResizeHandle ? "resize" : "drag"
      );
    });

    elements.gridBody.addEventListener("pointermove", updateDrag);
    elements.gridBody.addEventListener("pointerup", finishInteraction);
    elements.gridBody.addEventListener("pointercancel", finishInteraction);

    elements.gridBody.addEventListener("keydown", (event) => {
      const block = event.target.closest(".class-block");

      if (block) {
        moveSelectedWithKeyboard(event, block);
      }
    });

    elements.editorForm.addEventListener("submit", (event) => {
      event.preventDefault();
    });

    [
      elements.courseInput,
      elements.unitsInput,
      elements.sectionInput,
      elements.roomInput,
      elements.dayInput,
      elements.startInput,
      elements.endInput,
      elements.colorInput
    ].forEach((input) => {
      input.addEventListener("change", applyEditorChanges);
    });

    elements.unitsInput.addEventListener("input", () => {
      elements.unitsInput.setCustomValidity("");
    });

    elements.addButton.addEventListener("click", addClass);
    elements.duplicateButton.addEventListener("click", duplicateSelected);
    elements.deleteButton.addEventListener("click", deleteSelected);
    elements.undoButton.addEventListener("click", undo);
    elements.redoButton.addEventListener("click", redo);
    elements.resetButton.addEventListener("click", resetSchedule);
    elements.printButton.addEventListener("click", () => window.print());

    elements.closeEditorButton.addEventListener("click", clearSelection);
    elements.editorDuplicateButton.addEventListener(
      "click",
      duplicateSelected
    );
    elements.editorDeleteButton.addEventListener("click", deleteSelected);
    elements.editorPrintButton.addEventListener(
      "click",
      () => window.print()
    );

    window.addEventListener("keydown", (event) => {
      const modifier = event.ctrlKey || event.metaKey;

      if (!modifier) {
        return;
      }

      if (event.key.toLowerCase() === "z" && !event.shiftKey) {
        event.preventDefault();
        undo();
      }

      if (
        event.key.toLowerCase() === "y" ||
        (event.key.toLowerCase() === "z" && event.shiftKey)
      ) {
        event.preventDefault();
        redo();
      }
    });

    renderDayHeader();
    populateEditorOptions();
    renderAll();
  </script>
</body>
</html>
